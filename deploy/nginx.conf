# 放入 Nginx 的 http 上下文（通常 /etc/nginx/conf.d/portfolio.conf）。
# 将部署包的 site/ 内容上传到此目录；域名确定后替换 server_name。
server {
    listen 80;
    server_name _;
    root /var/www/portfolio/site;
    index index.html;
    # 正式路由的 try_files 直接提供 HTML，也必须每次向服务器确认版本。
    # 带独立 add_header 的静态资源和 404 location 保留各自缓存策略。
    add_header Cache-Control "no-cache";

    # 只为真实页面提供 SPA 外壳；坏链保留地址和 HTTP 404。
    error_page 404 /not-found.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /not-found.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /cards { try_files /cards/index.html =404; }
    location = /cards/ { try_files /cards/index.html =404; }
    location = /about { try_files /about/index.html =404; }
    location = /about/ { try_files /about/index.html =404; }
    location = /edit { try_files /edit/index.html =404; }
    location = /edit/ { try_files /edit/index.html =404; }
    location = /news { try_files /news/index.html =404; }
    location = /news/ { try_files /news/index.html =404; }
    location = /poster { try_files /poster/index.html =404; }
    location = /poster/ { try_files /poster/index.html =404; }
    location = /photo { try_files /photo/index.html =404; }
    location = /photo/ { try_files /photo/index.html =404; }
    location ~ ^/card/01/?$ { return 301 /about$is_args$args; }
    location ~ ^/card/02/?$ { return 301 /edit$is_args$args; }
    location ~ ^/card/03/?$ { return 301 /color$is_args$args; }
    location ~ ^/card/04/?$ { return 301 /news$is_args$args; }
    location ~ ^/card/05/?$ { return 301 /poster$is_args$args; }
    location ~ ^/card/06/?$ { return 301 /photo$is_args$args; }
    # /color 同时是页面与媒体目录，精确页面规则不能被目录接管。
    location = /color {
        try_files /color/index.html =404;
    }
    location = /color/ {
        try_files /color/index.html =404;
    }
    # 精确 HTML 入口不能落进下方 /color/ 媒体目录的七天缓存。
    location = /color/index.html {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Nginx 静态文件模块原生支持视频 Range/206，无需 Node 进程。
    location ^~ /color/ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location ~* \.(?:webp|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|mp4|pdf|js|css|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ /\. {
        deny all;
    }
}
