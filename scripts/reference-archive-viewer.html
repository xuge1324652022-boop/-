<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>参考站研究档案 · Squarespace Foundations</title>
<style>
:root{color-scheme:light;--paper:#f5f3ed;--ink:#25241f;--muted:#6d6b64;--line:#d4d1c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input,a{font:inherit}button,a,input{touch-action:manipulation}button{color:inherit;background:transparent;border:1px solid var(--line);padding:10px 14px;cursor:pointer}button:hover{background:#e9e6dd}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #25241f;outline-offset:4px}a{color:inherit;text-underline-offset:4px}header{padding:30px 4vw 24px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}h1{font-size:clamp(28px,3.4vw,50px);font-weight:400;letter-spacing:-.04em;margin:12px 0 8px}header p{margin:0;max-width:850px;color:var(--muted)}.page-nav{display:flex;flex-wrap:wrap;gap:0;padding:0 4vw;border-bottom:1px solid var(--line)}.page-nav button{border:0;border-bottom:2px solid transparent;padding:18px 20px 16px}.page-nav button[aria-pressed="true"]{border-bottom-color:var(--ink);background:#e9e6dd}.number{font-size:11px;margin-right:10px;color:var(--muted)}main{max-width:1800px;margin:auto;padding:28px 4vw 50px}.section-head{display:flex;align-items:baseline;gap:24px;justify-content:space-between;margin-bottom:18px}h2{font-size:26px;font-weight:400;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:32px}.stage{background:#e6e3db;min-height:270px;display:flex;align-items:center;justify-content:center}#frame{display:block;max-width:100%;width:100%;height:auto;max-height:62vh;object-fit:contain;cursor:zoom-in}.controls{display:grid;grid-template-columns:auto auto minmax(60px,1fr) auto;align-items:center;gap:14px;padding:16px 0}.controls input{width:100%;accent-color:var(--ink)}#counter{font-variant-numeric:tabular-nums;white-space:nowrap}h3{font-weight:400;font-size:21px;margin:5px 0 8px}.note{color:var(--muted);margin:0 0 20px}.evidence{font-size:11px;color:var(--muted);overflow-wrap:anywhere;border-top:1px solid var(--line);padding:15px 0}.links{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:15px}.sidebar-title{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.steps{max-height:65vh;overflow:auto;padding-right:5px;display:flex;flex-direction:column}.steps button{display:flex;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);gap:12px;padding:13px 8px}.steps button[aria-current="step"]{background:#e9e6dd}.steps span:first-child{font-size:11px;color:var(--muted);width:20px;flex-shrink:0}.records{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}details summary{cursor:pointer;font-size:18px;margin-bottom:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eeeae1;padding:25px;font:14px/1.8 Arial,"Microsoft YaHei",sans-serif}footer{border-top:1px solid var(--line);padding:22px 4vw;color:var(--muted);font-size:12px}dialog{padding:15px;border:0;background:var(--paper);max-width:96vw;max-height:96vh}dialog::backdrop{background:#000c}dialog img{display:block;max-width:90vw;max-height:82vh;object-fit:contain}dialog button{display:block;margin:0 0 12px auto}@media(max-width:900px){header{padding-top:22px}.page-nav button{padding:12px 10px}.layout{grid-template-columns:1fr;gap:15px}.steps{max-height:200px}.section-head{flex-direction:column;gap:8px}.controls{gap:8px}.controls button{padding:9px}#frame{max-height:52vh}pre{padding:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="eyebrow">REFERENCE ARCHIVE / 2026.10.14</div><h1>参考站研究档案</h1><p>首页与六个章节 · 原始截图、发布源码、动画参数与 REA 运行时证据集中保存，供后续开发复查</p></header>
<nav class="page-nav" id="pages" aria-label="研究页面"></nav>
<main>
<div class="section-head"><h2 id="title"></h2><a id="source" target="_blank" rel="noreferrer">查看参考页面 ↗</a></div>
<div class="layout"><section aria-label="阶段对照"><div class="stage"><img id="frame" alt=""></div><div class="controls"><button id="previous" aria-label="上一阶段">←</button><button id="next" aria-label="下一阶段">→</button><input id="phase" type="range" min="0" step="1" value="0" aria-label="阶段进度"><span id="counter"></span></div><h3 id="caption"></h3><p class="note" id="note"></p><div class="evidence" id="evidence"></div><div class="links"><a id="dom">对应 DOM</a><a id="accessibility">可访问文本</a><a id="report">完整分析报告</a><a id="runtime">实测记录</a><a id="tokens">动画参数 JSON</a></div></section><aside><p class="sidebar-title">STAGES / 阶段</p><div class="steps" id="steps"></div></aside></div>
<section class="records"><details><summary>在此阅读本页报告</summary><pre id="report-text"></pre></details><div class="links"><a href="全站分析.md">全站分析与开发索引</a><a href="README.md">目录说明</a><a href="来源索引.json">原始来源与归档路径</a><a href="完整性校验.json">最终完整性校验</a><a href="03-原始证据/capture-index.json">全部补充截图索引</a></div></section>
</main>
<footer>截图是离散滚动及交互状态记录，点击截图可放大 · 连续滚轮、触摸拖拽、FPS 与 Rive 内部曲线不属于已完成的实测结论 · 失败采样记录仍保存在原始证据中</footer>
<dialog id="zoom"><button id="close-zoom">关闭大图 ×</button><img id="large-frame" alt=""></dialog>
<script type="application/json" id="research-data">__RESEARCH_DATA__</script>
<script>
// 构建脚本把已归档的索引嵌入 research-data；阅读器本身不联网重新抓取参考站。
const research=JSON.parse(document.getElementById('research-data').textContent),pages=research.pages;
let active=0,phase=0;
const el=id=>document.getElementById(id);
pages.forEach((page,index)=>{const button=document.createElement('button');button.dataset.page=page.id;button.type='button';button.setAttribute('aria-pressed',String(index===0));const number=document.createElement('span');number.className='number';number.textContent=String(index).padStart(2,'0');button.append(number,document.createTextNode(page.title));button.addEventListener('click',()=>{active=index;phase=0;selectPage()});el('pages').append(button)});
function link(id,path){el(id).hidden=!path;if(path)el(id).href=path}
// 章节和阶段共用一份状态；每次换章重建阶段列表，图片、报告、证据链接同步更新。
function selectPage(){const page=pages[active];el('steps').replaceChildren();page.frames.forEach((frame,index)=>{const button=document.createElement('button');button.type='button';const number=document.createElement('span');number.textContent=String(index+1).padStart(2,'0');const label=document.createElement('span');label.textContent=frame.label;button.append(number,label);button.addEventListener('click',()=>{phase=index;render()});el('steps').append(button)});el('phase').max=page.frames.length-1;el('report-text').textContent=page.report_text;document.querySelectorAll('[data-page]').forEach((button,index)=>button.setAttribute('aria-pressed',String(index===active)));render()}
function render(){const page=pages[active],frame=page.frames[phase];el('title').textContent=page.title;el('source').href=page.url;el('note').textContent=page.note;el('frame').src=frame.image;el('frame').alt=page.title+' · '+frame.label;el('caption').textContent=frame.label;el('counter').textContent=(phase+1)+' / '+page.frames.length;el('phase').value=phase;el('evidence').textContent='REA Evidence: '+frame.evidence_id+' / Step: '+frame.step;link('dom',frame.dom);link('accessibility',frame.accessibility);link('report',page.report);link('runtime',page.runtime);link('tokens',page.tokens);el('previous').disabled=phase===0;el('next').disabled=phase===page.frames.length-1;Array.from(el('steps').children).forEach((button,index)=>{if(index===phase)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current')})}
el('previous').addEventListener('click',()=>{phase=Math.max(0,phase-1);render()});el('next').addEventListener('click',()=>{phase=Math.min(pages[active].frames.length-1,phase+1);render()});el('phase').addEventListener('input',event=>{phase=Number(event.target.value);render()});el('frame').addEventListener('click',()=>{el('large-frame').src=el('frame').src;el('large-frame').alt=el('frame').alt;el('zoom').showModal()});el('close-zoom').addEventListener('click',()=>el('zoom').close());window.addEventListener('keydown',event=>{if(el('zoom').open||event.target.tagName==='INPUT')return;if(event.key==='ArrowRight'){phase=Math.min(pages[active].frames.length-1,phase+1);render();event.preventDefault()}else if(event.key==='ArrowLeft'){phase=Math.max(0,phase-1);render();event.preventDefault()}});selectPage();
</script>
</body></html>
